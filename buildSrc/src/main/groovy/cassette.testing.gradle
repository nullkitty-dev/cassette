plugins {
    id 'java'
}

// A precompiled script plugin gets no type-safe `libs` accessor: those are generated for the
// build that owns the catalog, which is the root build and not buildSrc.
def libs = extensions.getByType(VersionCatalogsExtension).named('libs')

// The allowlist, test scope only. Zero runtime dependencies is policy, so anything proposed
// for `api` or `implementation` is a decision for review.
dependencies {
    testImplementation platform(libs.findLibrary('junit-bom').get())
    testImplementation libs.findLibrary('junit-jupiter').get()
    testImplementation libs.findLibrary('jqwik').get()
    testImplementation libs.findLibrary('assertj-core').get()
    testRuntimeOnly libs.findLibrary('junit-platform-launcher').get()
}

def fixtureSourceDir = layout.projectDirectory.dir('src/test/resources/fixtures')

tasks.named('test', Test) {
    useJUnitPlatform {
        includeEngines 'junit-jupiter', 'jqwik'
    }
    // Lets the fixture harness write golden files back to the source tree under
    // `-Dcassette.fixtures.update=true`, instead of to build/resources/test.
    systemProperty 'cassette.fixtures.sourceDir', fixtureSourceDir.asFile.absolutePath
    systemProperty 'cassette.fixtures.update', providers.systemProperty('cassette.fixtures.update').getOrElse('false')
    testLogging {
        events 'failed'
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
    }
}

// The whitebox tests sit in the module's own packages, so on the module path they would need
// --patch-module plumbing; `module-info` describes the published surface only.
tasks.named('compileTestJava', JavaCompile) { modularity.inferModulePath = false }
tasks.named('test', Test) { modularity.inferModulePath = false }
