# jqwik keeps a database of previously-failing samples so a fixed failure is retried
# first on the next run. It belongs in build/, not the source tree.
jqwik.database = build/jqwik-database
jqwik.failures.after.default = PREVIOUS_SEED

# 1000 is jqwik's default; stated explicitly because phase 3's recovery properties are
# the reason this library fuzzes at all, and the number is worth arguing about there.
jqwik.tries.default = 1000

jqwik.reporting.onlyfailures = true
